                        $ref: '#/components/schemas/BedConfiguration'
                maximumOccupancy:
                    $ref: '#/components/schemas/MaximumOccupancy'
                size:
                    $ref: '#/components/schemas/RoomSize'
                remainingRooms:
                    type: integer
                    minimum: 0
                roomCategoryCode:
                    type: string
                    description: 'Back-end room category code used by the property system.'
                summaryFeatures:
                    type: array
                    items:
                        $ref: '#/components/schemas/CodeLabelIcon'
                highlights:
                    type: array
                    items:
                        $ref: '#/components/schemas/CodeLabelIcon'
                amenities:
                    type: array
                    items:
                        $ref: '#/components/schemas/CodeLabelIcon'
                bathroomAmenities:
                    type: array
                    items:
                        $ref: '#/components/schemas/CodeLabelIcon'
                media:
                    $ref: '#/components/schemas/RoomMedia'
                fromPrice:
                    $ref: '#/components/schemas/FromPrice'
                rateGroups:
                    type: array
                    items:
                        $ref: '#/components/schemas/RateGroup'
        BedConfiguration:
            type: object
            required:
                - bedType
                - label
                - quantity
            properties:
                bedType:
                    type: string
                label:
                    type: string
                quantity:
                    type: integer
                    minimum: 1
        MaximumOccupancy:
            type: object
            required:
                - totalGuests
                - adults
                - children
            properties:
                totalGuests:
                    type: integer
                    minimum: 1
                adults:
                    type: integer
                    minimum: 1
                children:
                    type: integer
                    minimum: 0
        RoomSize:
            type: object
            required:
                - value
                - unit
            properties:
                value:
                    type: number
                    format: double
                    minimum: 0
                unit:
                    type: string
        RoomMedia:
            $ref: '#/components/schemas/PropertyMedia'
        FromPrice:
            type: object
            required:
                - amount
                - currency
                - numberOfNights
            properties:
                amount:
                    type: number
                    format: double
                    minimum: 0
                currency:
                    type: string
                    minLength: 3
                    maxLength: 3
                numberOfNights:
                    type: integer
                    minimum: 1
        RateGroup:
            type: object
            required:
                - type
                - label
                - rates
            properties:
                type:
                    type: string
                    enum:
                        - PUBLIC
                        - MEMBER
                label:
                    type: string
                membershipPromotion:
                    $ref: '#/components/schemas/MembershipPromotion'
                rates:
                    type: array
                    items:
                        $ref: '#/components/schemas/PropertyRate'
        MembershipPromotion:
            type: object
            required:
                - savingPercentage
            properties:
                savingPercentage:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 100
        PropertyRate:
            allOf:
                -
                    $ref: '#/components/schemas/PropertyRateCore'
                -
                    type: object
                    properties:
                        anotherRates:
                            type: array
                            description: 'Alternate rate options grouped by a dimension such as meal plan (e.g. breakfast add-on).'
                            items:
                                $ref: '#/components/schemas/AlternatePropertyRate'
        PropertyRateCore:
            type: object
            required:
                - ratePlanCode
                - rateGroupCode
                - codeForReservation
                - rateName
                - rateDescription
                - badges
                - pricing
                - cancellation
                - loyalty
                - directBookingBenefits
            properties:
                ratePlanCode:
                    type: string
                rateGroupCode:
                    type: string
                codeForReservation:
                    $ref: '#/components/schemas/RateCodeForReservation'
                rateName:
                    type: string
                rateDescription:
                    type: string
                badges:
                    type: array
                    items:
                        type: string
                pricing:
                    $ref: '#/components/schemas/RatePricing'
                cancellation:
                    $ref: '#/components/schemas/CancellationPolicy'
                loyalty:
                    $ref: '#/components/schemas/LoyaltyValue'
                directBookingBenefits:
                    type: array
                    items:
                        $ref: '#/components/schemas/CodeLabelIcon'
        AlternatePropertyRate:
            allOf:
                -
                    $ref: '#/components/schemas/PropertyRateCore'
                -
                    type: object
                    required:
                        - additionalPrice
                    properties:
                        additionalPrice:
                            type: number
                            format: double
                            description: "Price delta relative to the parent base rate total (this pricing.total − parent pricing.total). Positive when the alternate option costs more (e.g. +500 THB for breakfast).\n"
        RateCodeForReservation:
            type: object
            description: "Canonical identifiers to send when reserving this rate.\n"
            required:
                - propertyCode
                - roomCode
                - ratePlanCode
                - rateGroupCode
            properties:
                propertyCode:
                    type: string
                roomCode:
                    type: string
                ratePlanCode:
                    type: string
                rateGroupCode:
                    type: string
        CodeLabel:
            type: object
            required:
                - code
                - label
            properties:
                code:
                    type: string
                label:
                    type: string
        RatePricing:
            type: object
            required:
                - currency
                - total
                - pricePerNight
                - numberOfNights
            properties:
                currency:
                    type: string
                    minLength: 3
                    maxLength: 3
                total:
                    type: number
                    format: double
                    minimum: 0
                pricePerNight:
                    type: number
                    format: double
                    minimum: 0
                numberOfNights:
                    type: integer
                    minimum: 1
        CancellationPolicy:
            type: object
            required:
                - refundable
                - freeCancellation
                - freeCancellationDeadline
                - timezone
                - displayText
                - penaltyAmount
            properties:
                refundable:
                    type: boolean
                freeCancellation:
                    type: boolean
                freeCancellationDeadline:
                    type: string
                    format: date-time
                timezone:
                    type: string
                displayText:
                    type: string
                penaltyAmount:
                    type: number
                    format: double
                    minimum: 0
        LoyaltyValue:
            type: object
            required:
                - earnAmount
                - redeemableAmount
                - currency
            properties:
                earnAmount:
                    type: number
                    format: double
                    minimum: 0
                redeemableAmount:
                    type: number
                    format: double
                    minimum: 0
                currency:
                    type: string
        BrandIcon:
            type: object
            properties:
                domain:
                    type: string
                path:
                    type: string
        Member_LoginRequest:
            type: object
            additionalProperties: false
            required:
                - login
                - password
            properties:
                login:
                    type: string
                    minLength: 1
                    maxLength: 254
                    description: 'GHA username or email address.'
                password:
                    type: string
                    minLength: 1
                    maxLength: 1024
                    format: password
                    writeOnly: true
        Member_RegisterRequest:
            type: object
            additionalProperties: false
            required:
                - email
                - password
                - firstName
                - lastName
                - language
                - ghaMarketingYn
                - consentFlags
            description: "Native-name fields must be supplied together. China-applicable requests must accept the China Addendum. These cross-field rules are enforced by the generated server implementation and domain validation.\n"
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 254
                password:
                    type: string
                    minLength: 8
                    maxLength: 50
                    pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9 ])[\x21-\x7E](?:[\x20-\x7E]*[\x21-\x7E])?$'
                    format: password
                    writeOnly: true
                    description: 'Must contain at least one ASCII letter, one number, and one symbol, with no leading or trailing spaces.'
                firstName:
                    type: string
                    minLength: 1
                    maxLength: 200
                    pattern: '^[A-Za-z][A-Za-z .''-]*$'
                    description: 'International/English spelling accepted by GHA.'
                lastName:
                    type: string
                    minLength: 1
                    maxLength: 200
                    pattern: '^[A-Za-z][A-Za-z .''-]*$'
                    description: 'International/English spelling sent to GHA and protected in the issued token.'
                nativeFirstName:
                    type: string
                    minLength: 1
                    maxLength: 200
                nativeLastName:
                    type: string
                    minLength: 1
                    maxLength: 200
                nativeLanguage:
                    type: string
                    minLength: 1
                    maxLength: 10
                    description: 'Required together with nativeFirstName and nativeLastName.'
                language:
                    type: string
                    minLength: 1
                    maxLength: 10
                    description: 'GHA language code selected from GET /api/v1/gha/languages.'
                birthday:
                    type: string
                    format: date
                chinaResident:
                    type: boolean
                    description: 'Self-identification used only to enforce China Addendum acceptance; not forwarded to GHA.'
                phone:
                    type: object
                    additionalProperties: false
                    required:
                        - type
                    properties:
                        type:
                            type: string
                            enum:
                                - MOBILE
                                - HOME
                                - BUSINESS
                        number:
                            type: string
                            minLength: 1
                            maxLength: 50
                address:
                    type: object
                    additionalProperties: false
                    required:
                        - type
                        - city
                        - country
                    properties:
                        type:
                            type: string
                            enum:
                                - HOME
                                - BUSINESS
                        address1:
                            type: string
                            maxLength: 200
                        address2:
                            type: string
                            maxLength: 200
                        city:
                            type: string
                            minLength: 1
                            maxLength: 200
                        state:
                            type: string
                            maxLength: 10
                            description: 'State code selected from GET /api/v1/gha/states when available.'
                        country:
                            type: string
                            minLength: 2
                            maxLength: 2
                            pattern: '^[A-Z]{2}$'
                            description: 'Country code selected from GET /api/v1/gha/countries.'
                        zipCode:
                            type: string
                            maxLength: 30
                        company:
                            type: string
                            maxLength: 200
                ghaMarketingYn:
                    type: boolean
                    description: 'GHA marketing choice; true is opt-in and false is opt-out.'
                consentFlags:
                    type: object
                    additionalProperties: false
                    required:
                        - termsAccepted
                        - privacyAccepted
                    properties:
                        termsAccepted:
                            type: boolean
                            enum:
                                - true
                        privacyAccepted:
                            type: boolean
                            enum:
                                - true
                        chinaAddendumAccepted:
                            type: boolean
                            description: 'Must be true for a China IP address or self-identified Chinese resident.'
        Member_RefreshRequest:
            type: object
            additionalProperties: false
            required:
                - refreshToken
            properties:
                refreshToken:
                    type: string
                    minLength: 1
                    maxLength: 16384
                    writeOnly: true
        Member_AuthResponse:
            type: object
            additionalProperties: false
            required:
                - accessToken
                - refreshToken
                - tokenType
                - accessExpiresIn
                - refreshExpiresIn
                - member
            properties:
                accessToken:
                    type: string
                    description: 'Signed EdDSA JWS encrypted as a dir + A256GCM JWE.'
                refreshToken:
                    type: string
                    description: 'Signed EdDSA JWS encrypted as a dir + A256GCM JWE.'
                tokenType:
                    type: string
                    enum:
                        - Bearer
                accessExpiresIn:
                    type: integer
                    minimum: 1
                refreshExpiresIn:
                    type: integer
                    minimum: 1
                member:
                    $ref: '#/components/schemas/Member_Member'
        Member_TokenResponse:
            type: object
            additionalProperties: false
            required:
                - accessToken
                - refreshToken
                - tokenType
                - accessExpiresIn
                - refreshExpiresIn
            properties:
                accessToken:
                    type: string
                    description: 'Signed EdDSA JWS encrypted as a dir + A256GCM JWE.'
                refreshToken:
                    type: string
                    description: 'Signed EdDSA JWS encrypted as a dir + A256GCM JWE.'
                tokenType:
                    type: string
                    enum:
                        - Bearer
                accessExpiresIn:
                    type: integer
                    minimum: 1
                    description: 'Seconds until access-token expiry.'
                refreshExpiresIn:
                    type: integer
                    minimum: 1
                    description: 'Seconds until refresh-token expiry, bounded by absolute session expiry.'
        Member_MemberResponse:
            type: object
            additionalProperties: false
            required:
                - member
            properties:
                member:
                    $ref: '#/components/schemas/Member_Member'
        Member_Member:
            type: object
            additionalProperties: false
            required:
                - firstName
                - lastName
                - membershipCardNo
                - membershipLevel
                - discoveryBalance
                - effectiveDate
                - expirationDate
            description: 'Sanitized canonical member data; never a raw GHA payload.'
            properties:
                firstName:
                    type: string
                    nullable: true
                    maxLength: 200
                    description: 'GHA profile first name.'
                lastName:
                    type: string
                    nullable: true
                    maxLength: 200
                    description: 'GHA profile last name; PII that must not be logged.'
                membershipCardNo:
                    type: string
                    nullable: true
                    maxLength: 100
                    description: 'Card number from the primary DISCOVERY membership; may be alphanumeric.'
                membershipLevel:
                    type: string
                    nullable: true
                    maxLength: 100
                    description: 'Current level from the primary DISCOVERY membership.'
                discoveryBalance:
                    type: number
                    nullable: true
                    format: double
                    minimum: 0
                    description: 'Available DISCOVERY Dollar balance from GHA GRAVTY data.'
                effectiveDate:
                    type: integer
                    nullable: true
                    format: int64
                    minimum: 0
                    description: 'Primary DISCOVERY membership effective date as Unix seconds.'
                expirationDate:
                    type: integer
                    nullable: true
                    format: int64
                    minimum: 0
                    description: 'Primary DISCOVERY membership-level expiration date as Unix seconds.'
        Member_ReferenceDataResponse:
            type: object
            additionalProperties: false
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Member_ReferenceDataItem'
        Member_ReferenceDataItem:
            type: object
            additionalProperties: false
            required:
                - code
                - name
            properties:
                code:
                    type: string
                    minLength: 1
                    maxLength: 20
                name:
                    type: string
                    minLength: 1
                    maxLength: 200
        Member_Error:
            type: object
            additionalProperties: false
            required:
                - code
                - message
                - correlationId
            properties:
                code:
                    type: string
                    enum:
                        - INVALID_REQUEST
                        - INVALID_CREDENTIALS
                        - INVALID_TOKEN
                        - ACCOUNT_ALREADY_EXISTS
                        - IDEMPOTENCY_CONFLICT
                        - CONSENT_REQUIRED
                        - RATE_LIMITED
                        - GHA_UNAVAILABLE
                        - SERVICE_UNAVAILABLE
                message:
                    type: string
                correlationId:
                    type: string
        Reservation_HealthResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/Reservation_Health'
        Reservation_Health:
            type: object
            required:
                - service
                - state
            properties:
                service:
                    type: string
                    example: reservation-service
                state:
                    type: string
                    example: ok
                checkedAt:
                    type: string
                    format: date-time
        Reservation_CreateReservationRequest:
            type: object
            additionalProperties: false
            required:
                - from
                - to
                - codeForReservation
                - rooms
            properties:
                from:
                    type: string
                    format: date
                    description: 'Check-in date (inclusive).'
                to:
                    type: string
                    format: date
                    description: 'Check-out date (exclusive). Must be after from.'
                codeForReservation:
                    $ref: '#/components/schemas/Reservation_CodeForReservation'
                rooms:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/Reservation_ReservationRoom'
        Reservation_CodeForReservation:
            type: object
            description: "Canonical identifiers from property detail RateCodeForReservation. propertyCode, roomCode, ratePlanCode, and rateGroupCode are required.\n"
            additionalProperties: false
            required:
                - propertyCode
                - roomCode
                - ratePlanCode
                - rateGroupCode
            properties:
                propertyCode:
                    type: string
                    minLength: 1
                roomCode:
                    type: string
                    minLength: 1
                ratePlanCode:
                    type: string
                    minLength: 1
                rateGroupCode:
                    type: string
                    minLength: 1
        Reservation_ReservationRoom:
            type: object
            additionalProperties: false
            required:
                - adultsCount
                - childrenCount
                - childAges
            properties:
                adultsCount:
                    type: integer
                    minimum: 1
                childrenCount:
                    type: integer
                    minimum: 0
                childAges:
                    type: array
                    description: "Ages in years for each child. Array length MUST equal childrenCount (use an empty array when childrenCount is 0).\n"
                    items:
                        type: integer
                        minimum: 0
                        maximum: 17
        Reservation_CreateReservationResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/Reservation_CreateReservationData'
        Reservation_CreateReservationData:
            type: object
            required:
                - reservationId
            properties:
                reservationId:
                    type: string
                    minLength: 1
                    description: 'Opaque CCH reservation identifier.'
        Reservation_GetReservationResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/Reservation_GetReservationData'
        Reservation_ReservationProperty:
            type: object
            additionalProperties: false
            required:
                - name
                - location
            properties:
                name:
                    type: string
                    description: 'Display name of the hotel/property.'
                    example: 'Anantara Koh Yao Yai Resort & Villas'
                location:
                    $ref: '#/components/schemas/Reservation_PropertyLocation'
        Reservation_PropertyLocation:
            type: object
            required:
                - address
                - coordinates
                - travelInformation
            properties:
                address:
                    $ref: '#/components/schemas/Reservation_PropertyAddress'
                coordinates:
                    $ref: '#/components/schemas/Reservation_Coordinates'
                travelInformation:
                    type: array
                    items:
                        type: string
                directionUrl:
                    type: string
                    format: uri
        Reservation_PropertyAddress:
            type: object
            additionalProperties: false
            required:
                - fullAddress
            properties:
                fullAddress:
                    type: string
                    description: 'Complete formatted postal address of the property.'
                    example: '101/2 Moo 7, Koh Yao Yai, Koh Yao, Phang Nga, 82160, Thailand'
        Reservation_Coordinates:
            type: object
            required:
                - latitude
                - longitude
            properties:
                latitude:
                    type: number
                    format: double
                    minimum: -90
                    maximum: 90
                longitude:
                    type: number
                    format: double
                    minimum: -180
                    maximum: 180
        Reservation_GetReservationData:
            type: object
            additionalProperties: false
            required:
                - status
                - property
                - room
                - from
                - to
                - paymentTerms
                - primaryGuest
                - guestRooms
                - roomPreferences
                - priceSummary
            properties:
                status:
                    type: string
                    enum:
                        - PENDING
                        - CONFIRMED
                        - FINISHED
                property:
                    $ref: '#/components/schemas/Reservation_ReservationProperty'
                room:
                    $ref: '#/components/schemas/Reservation_PriceSummaryRoom'
                from:
                    type: string
                    format: date
                    description: 'Check-in date (inclusive).'
                    example: {}
                to:
                    type: string
                    format: date
                    description: 'Check-out date (exclusive). Must be after from.'
                    example: {}
                paymentTerms:
                    type: array
                    description: 'Applicable terms and conditions for payment (e.g. rate-specific guarantee or cancellation policy).'
                    items:
                        type: string
                    example:
                        - 'Full prepayment required.'
                        - Non-refundable.
                primaryGuest:
                    anyOf:
                        -
                            $ref: '#/components/schemas/Reservation_PrimaryGuest'
                    nullable: true
                guestRooms:
                    type: array
                    nullable: true
                    items:
                        $ref: '#/components/schemas/Reservation_GuestRoom'
                roomPreferences:
                    type: array
                    nullable: true
                    items:
                        $ref: '#/components/schemas/Reservation_RoomPreference'
                priceSummary:
                    $ref: '#/components/schemas/Reservation_PriceSummary'
        Reservation_PrimaryGuest:
            type: object
            additionalProperties: false
            required:
                - firstName
                - lastName
                - email
                - nationality
                - phone
            properties:
                firstName:
                    type: string
                lastName:
                    type: string
                email:
                    type: string
                nationality:
                    type: string
                phone:
                    $ref: '#/components/schemas/Reservation_Phone'
        Reservation_Phone:
            type: object
            additionalProperties: false
            required:
                - countryCode
                - number
            properties:
                countryCode:
                    type: string
                    description: 'International dialing prefix (e.g. +66).'
                number:
                    type: string
                    description: 'National number without country code.'
        Reservation_GuestRoom:
            type: object
            additionalProperties: false
            required:
                - guests
            properties:
                guests:
                    type: array
                    items:
                        $ref: '#/components/schemas/Reservation_RoomGuest'
        Reservation_RoomGuest:
            type: object
            additionalProperties: false
            required:
                - firstName
                - lastName
            properties:
                firstName:
                    type: string
                lastName:
                    type: string
        Reservation_RoomPreference:
            type: object
            additionalProperties: false
            required:
                - type
                - value
            properties:
                type:
                    type: string
                    description: "Preference category. Closed enum values are deferred; treat as opaque string until product locks the list.\n"
                value:
                    type: string
        Reservation_PriceSummary:
            type: object
            additionalProperties: false
