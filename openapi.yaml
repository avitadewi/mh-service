                '400':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Invalid property code'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '404':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Property not found'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/destination-search:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getDestinationSearch
            summary: 'Destination search autocomplete'
            tags:
                - Search
            parameters:
                -
                    $ref: '#/components/parameters/XLanguageRequired'
                -
                    name: q
                    in: query
                    required: true
                    description: 'Search text (minimum 2 characters).'
                    schema:
                        type: string
                        minLength: 2
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Autocomplete suggestions'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DestinationSearchResponse'
                '400':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Invalid request'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /gha/auth/login:
        parameters:
            -
                $ref: '#/components/parameters/Member_LegacyRequestId'
        post:
            tags:
