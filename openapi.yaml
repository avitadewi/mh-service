openapi: 3.0.3
info:
    title: 'Minor Hotels CCH Mock API (Unified)'
    version: 1.0.0
    description: 'Unified interactive mock API docs combining Content, Member, and Reservation services.'
paths:
    /health/live:
        parameters:
            -
                $ref: '#/components/parameters/Reservation_CorrelationId'
            -
                $ref: '#/components/parameters/Reservation_LegacyRequestId'
        get:
            summary: 'Liveness probe'
            operationId: getHealthLive
            tags:
                - Health
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/Reservation_CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/Reservation_LegacyRequestId'
                    description: 'Service process is alive.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_HealthResponse'
    /health/ready:
        parameters:
            -
                $ref: '#/components/parameters/Reservation_CorrelationId'
            -
                $ref: '#/components/parameters/Reservation_LegacyRequestId'
        get:
            summary: 'Readiness probe'
            operationId: getHealthReady
            tags:
                - Health
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/Reservation_CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/Reservation_LegacyRequestId'
                    description: 'Service is ready to serve traffic.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_HealthResponse'
                '503':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/Reservation_CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/Reservation_LegacyRequestId'
                    description: 'Service is not ready.'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_ErrorResponse'
    /content/v1/layout/top-navigation:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getNavigationConfig
            summary: 'Fetch navigation configuration (menus, languages, currencies, help)'
            tags:
                - Navigation
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
                -
                    name: platform
                    in: query
                    description: 'Target platform'
                    schema:
                        type: string
                        enum:
                            - android
                            - ios
                -
                    name: currency
                    in: query
                    description: 'Preferred currency'
                    schema:
                        type: string
                        default: USD
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Navigation configuration'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NavigationConfigResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/layout/footer:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getFooterConfig
            summary: 'Fetch footer configuration (columns, copyright, social links)'
            tags:
                - Layout
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Footer configuration'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FooterConfigResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/home/sections:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getHomeSections
            summary: 'Fetch home screen sections (explore, dining, etc.)'
            tags:
                - Home
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Home screen sections'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HomeSectionsResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/properties/search-config:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getSearchConfig
            summary: 'Fetch property search configuration (fields, buttons)'
            tags:
                - Properties
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Search configuration'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchConfigResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/properties/filters:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getPropertyFilters
            summary: 'Fetch property search filters (sort options, filter categories)'
            tags:
                - Properties
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
                -
                    name: destination_id
                    in: query
                    description: 'Destination identifier'
                    schema:
                        type: string
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Property filters'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PropertyFiltersResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/properties/sort-options:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getPropertySortOptions
            summary: 'Fetch property search sort options'
            tags:
                - Properties
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Property sort options'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PropertySortOptionsResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/static-resources:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getStaticResources
            summary: 'Fetch static UI copy and icons grouped by page'
            tags:
                - Content
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
                -
                    name: page
                    in: query
                    description: 'Optional page filter (e.g. home). Omit to return all pages.'
                    schema:
                        type: string
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Static resources'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaticResourcesResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /content/v1/properties/property-list-search:
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getPropertyListSearch
            summary: 'Search properties for a destination'
            tags:
                - Properties
            parameters:
                -
                    name: cityCode
                    in: query
                    schema:
                        type: string
                -
                    name: countryCode
                    in: query
                    schema:
                        type: string
                -
                    name: from
                    in: query
                    required: true
                    schema:
                        type: string
                        format: date
                -
                    name: to
                    in: query
                    required: true
                    schema:
                        type: string
                        format: date
                -
                    name: rooms
                    in: query
                    required: true
                    schema:
                        type: integer
                        minimum: 1
                -
                    name: adults
                    in: query
                    required: true
                    schema:
                        type: integer
                        minimum: 1
                -
                    name: children
                    in: query
                    required: true
                    schema:
                        type: integer
                        minimum: 0
                -
                    name: infants
                    in: query
                    required: true
                    schema:
                        type: integer
                        minimum: 0
                -
                    name: tags
                    in: query
                    description: 'Comma-separated tag filters (OR semantics)'
                    schema:
                        type: string
                -
                    name: promoCode
                    in: query
                    schema:
                        type: string
                -
                    name: sort
                    in: query
                    schema:
                        type: string
                        enum:
                            - price-high-to-low
                            - price-low-to-high
                            - top-review-score
                -
                    $ref: '#/components/parameters/XLanguage'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Property list search results'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PropertyListSearchResponse'
                            examples:
                                phuketResults:
                                    summary: 'Phuket property list search'
                                    value:
                                        data:
                                            total: 1
                                            properties: [{searchId: property-AN-TH-004, propertyCode: AN-TH-004, title: 'Anantara Koh Yao Yai Resort & Villas', cityName: Phuket, tags: [WELLNESS, FAMILY, PET_FRIENDLY], tripadvisorReviewScore: 4.8, hotelStars: 5, brandIcon: {domain: cdn.example.com, path: /brands/anantara.svg}, pricePerNight: 12040, currency: USD, media: {gallery: [{id: property-image-1, url: 'https://cdn.example.com/properties/AN-TH-004/gallery-1.jpg', thumbnailUrl: 'https://cdn.example.com/properties/AN-TH-004/gallery-1-thumb.jpg', altText: 'Resort outdoor lounge', sortOrder: 1}], view360Url: 'https://cdn.example.com/properties/AN-TH-004/360view.html'}, location: {address: {fullAddress: '101/2 Moo 7, Koh Yao Yai, Koh Yao, Phang Nga, 82160, Thailand'}, coordinates: {latitude: 8.012543, longitude: 98.591244}}}]
                '400':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Invalid request'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '500':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    '/content/v1/properties/{propertyCode}':
        parameters:
            -
                $ref: '#/components/parameters/CorrelationId'
            -
                $ref: '#/components/parameters/LegacyRequestId'
        get:
            operationId: getPropertyByCode
            summary: 'Fetch property details by property code'
            tags:
                - Properties
            parameters:
                -
                    $ref: '#/components/parameters/XLanguage'
                -
                    name: propertyCode
                    in: path
                    required: true
                    description: 'Unique property code.'
                    example: AN-TH-004
                    schema:
                        type: string
                        minLength: 1
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/LegacyRequestId'
                    description: 'Property details'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PropertyDetailResponse'
                            examples:
                                anantaraKohYaoYai:
                                    summary: 'Anantara Koh Yao Yai Resort & Villas'
                                    value:
                                        data:
                                            property: {propertyCode: AN-TH-004, propertyBackCode: AN-TH-DD-004, title: 'Anantara Koh Yao Yai Resort & Villas', cityName: Phuket, tags: [WELLNESS, FAMILY, PET_FRIENDLY], tripadvisorReviewScore: 4.8, tripadvisorReviewCount: 248, hotelStars: 5, brandIcon: {domain: cdn.example.com, path: /brands/anantara.svg}, thumbnailUrl: 'https://cdn.example.com/properties/AN-TH-004/thumbnail.jpg', locationName: 'Ko Yao Yai Island', countryCode: TH, overview: {shortDescription: 'An all-villa sanctuary surrounded by emerald limestone cliffs, turquoise waters and lush jungle.', fullDescription: 'At Anantara, we believe that every journey should live long in the memory. This all-villa sanctuary offers an intimate escape into nature, surrounded by emerald limestone cliffs, turquoise waters and lush jungle.'}, media: {gallery: [{id: property-image-1, url: 'https://cdn.example.com/properties/AN-TH-004/gallery-1.jpg', thumbnailUrl: 'https://cdn.example.com/properties/AN-TH-004/gallery-1-thumb.jpg', altText: 'Resort outdoor lounge', sortOrder: 1}], view360Url: 'https://cdn.example.com/properties/AN-TH-004/360view.html'}, accommodationSummary: [{type: SUITE, label: Suites, count: 148}, {type: VILLA, label: Villas, count: 42}, {type: RESIDENCE, label: Residences, count: 27}], guestLovedFeatures: [{code: BEACHFRONT, label: Beachfront, icon: beachfront}, {code: PRIVATE_BEACH, label: 'Private beach', icon: private-beach}, {code: PRIVATE_POOL, label: 'Private pool', icon: pool}, {code: WATERSPORTS_CENTRE, label: 'Watersports centre', icon: watersports}], amenities: {featured: [{code: BUSINESS_SERVICES, label: 'Business services', icon: business-services}, {code: WATERSPORTS, label: 'Water sports', icon: watersports}, {code: INTERNET_ACCESS, label: 'Internet access', icon: wifi}, {code: TECHNOGYM, label: Technogym, icon: gym}], other: [{code: VALET_SERVICES, label: 'Valet services', icon: valet}, {code: CONCIERGE, label: Concierge, icon: concierge}, {