            description: "Starts a reservation from property-detail rate selection, stay dates, and per-room occupancy. Returns a reservationId for downstream checkout steps.\nValidation (enforced at runtime; document cross-field rules here because OpenAPI schema cannot express them): - to must be strictly after from (YYYY-MM-DD). - rooms must contain at least one entry. - For each room, childAges length must equal childrenCount (empty array when zero). - Each child age must be 0–17 inclusive. - Idempotency-Key header is required (16–128 characters).\n"
            tags:
