                    $ref: '#/components/parameters/Reservation_CorrelationId'
                -
                    $ref: '#/components/parameters/Reservation_LegacyRequestId'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/Reservation_CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/Reservation_LegacyRequestId'
                    description: 'Supported nationalities list'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_GetNationalitiesResponse'
                            examples:
                                success:
                                    value:
                                        data:
                                            - {code: TH, name: Thai}
                                            - {code: SG, name: Singaporean}
                                            - {code: US, name: American}
                '500':
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_ErrorResponse'
    /reservations/v1/reference/country-codes:
        get:
            operationId: getReferenceCountryCodes
            summary: 'Get country calling codes'
            description: "Returns a list of country telephone calling/dialing prefixes (e.g., +66) along with their standard country name and ISO 3166-1 alpha-2 codes.\n"
            tags:
                - Reference
            parameters:
                -
                    $ref: '#/components/parameters/Reservation_CorrelationId'
                -
                    $ref: '#/components/parameters/Reservation_LegacyRequestId'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/Reservation_CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/Reservation_LegacyRequestId'
                    description: 'Country calling codes list'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_GetCountryCodesResponse'
                            examples:
                                success:
                                    value:
                                        data:
                                            - {code: TH, name: Thailand, countryCode: '+66'}
                                            - {code: SG, name: Singapore, countryCode: '+65'}
                                            - {code: US, name: 'United States', countryCode: '+1'}
                '500':
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_ErrorResponse'
    /reservations/v1/reference/room-preferences:
        get:
            operationId: getReferenceRoomPreferences
            summary: 'Get room preference selection metadata'
            description: "Returns the room preference selection questions and options to let guests select preferences.\n"
            tags:
                - Reference
            parameters:
                -
                    $ref: '#/components/parameters/Reservation_CorrelationId'
                -
                    $ref: '#/components/parameters/Reservation_LegacyRequestId'
            responses:
                '200':
                    headers:
                        X-Correlation-ID:
                            $ref: '#/components/headers/Reservation_CorrelationId'
                        X-Request-ID:
                            $ref: '#/components/headers/Reservation_LegacyRequestId'
                    description: 'Room preference selection metadata'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_GetRoomPreferenceSelectionResponse'
                            examples:
                                success:
                                    value:
                                        data:
                                            questions: [{type: BED_TYPE, text: 'What is your preferred bed type?'}, {type: SMOKING_PREFERENCE, text: 'Do you prefer a smoking or non-smoking room?'}]
                                            options: [{type: BED_TYPE, label: 'King Bed', value: KING}, {type: BED_TYPE, label: 'Twin Bed', value: TWIN}, {type: SMOKING_PREFERENCE, label: Non-Smoking, value: NON_SMOKING}, {type: SMOKING_PREFERENCE, label: Smoking, value: SMOKING}]
                '500':
                    description: 'Internal server error'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Reservation_ErrorResponse'
