                    maximum: 180
        PropertyRoom:
            type: object
            required:
                - roomCode
                - roomName
                - description
                - bedConfiguration
                - maximumOccupancy
                - size
                - remainingRooms
                - roomCategoryCode
                - summaryFeatures
                - highlights
                - amenities
                - bathroomAmenities
                - media
                - fromPrice
                - rateGroups
            properties:
                roomCode:
                    type: string
                roomName:
                    type: string
                description:
                    type: string
                bedConfiguration:
                    type: array
