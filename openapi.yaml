                                    to: '2026-07-27'
                                    codeForReservation:
                                        propertyCode: AN-TH-004
                                        roomCode: DELUXE_POOL_VILLA
                                        ratePlanCode: ONHR
                                        rateGroupCode: ADVANCE_SAVER
                                    rooms:
                                        -
                                            adultsCount: 2
                                            childrenCount: 0
                                            childAges: []
                                        -
                                            adultsCount: 1
                                            childrenCount: 1
