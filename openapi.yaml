                    type: boolean
        Reservation_PriceSummaryRoom:
            type: object
            additionalProperties: false
            required:
                - name
                - quantity
                - amount
                - nights
                - adults
                - children
                - infants
                - board
            properties:
                name:
                    type: string
                quantity:
                    type: integer
                    minimum: 1
                amount:
                    type: number
                nights:
                    type: integer
                    minimum: 1
                adults:
                    type: integer
                    minimum: 0
                children:
                    type: integer
                    minimum: 0
                infants:
                    type: integer
                    minimum: 0
                board:
                    type: string
        Reservation_TaxesAndFees:
            type: object
            additionalProperties: false
            required:
                - total
                - items
            properties:
                total:
                    type: number
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Reservation_TaxFeeItem'
        Reservation_TaxFeeItem:
            type: object
            additionalProperties: false
            required:
                - name
                - amount
            properties:
                name:
                    type: string
                amount:
                    type: number
        Reservation_ConfirmReservationRequest:
            type: object
            additionalProperties: false
            required:
                - primaryGuest
                - guestRooms
                - roomPreferences
            properties:
                primaryGuest:
                    $ref: '#/components/schemas/Reservation_PrimaryGuest'
                guestRooms:
                    type: array
                    items:
                        $ref: '#/components/schemas/Reservation_GuestRoom'
                roomPreferences:
                    type: array
                    description: 'May be empty when no preferences are set.'
                    items:
                        $ref: '#/components/schemas/Reservation_RoomPreference'
        Reservation_ConfirmReservationResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/Reservation_ConfirmReservationData'
        Reservation_ConfirmReservationData:
