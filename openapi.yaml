                        type: string
                        minLength: 1
                    example: resv_01HXYZexample
                -
                    $ref: '#/components/parameters/Reservation_IdempotencyKey'
                -
                    $ref: '#/components/parameters/Reservation_CorrelationId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Reservation_ConfirmReservationRequest'
                        examples:
