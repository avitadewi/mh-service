                                        email: guest@example.com
                                        nationality: TH
                                        phone:
                                            countryCode: '+66'
                                            number: '812345678'
                                    guestRooms:
                                        -
                                            guests: [{firstName: Ada, lastName: Lovelace}]
                                    roomPreferences: []
            responses:
