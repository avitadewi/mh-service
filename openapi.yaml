        Reservation_GetCountryCodesResponse:
            type: object
            required:
                - data
            additionalProperties: false
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/Reservation_CountryCode'
        Reservation_CountryCode:
            type: object
            required:
                - code
                - name
                - countryCode
            additionalProperties: false
            properties:
                code:
                    type: string
                    example: TH
                    description: 'ISO 3166-1 alpha-2 country code.'
                name:
                    type: string
                    example: Thailand
                    description: 'English country name.'
                countryCode:
                    type: string
                    example: '+66'
                    description: 'International dialing prefix.'
        Reservation_GetRoomPreferenceSelectionResponse:
            type: object
            required:
                - data
            additionalProperties: false
            properties:
                data:
                    $ref: '#/components/schemas/Reservation_RoomPreferenceSelection'
        Reservation_RoomPreferenceSelection:
            type: object
            required:
                - questions
                - options
