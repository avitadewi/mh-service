openapi: 3.0.3
info:
  title: CCH reservation-service API
  version: 0.3.0
  description: >
    Health probes, create-reservation, get-reservation, and confirm-reservation
    contracts for the CCH reservation-service. codeForReservation aligns with
    content-service RateCodeForReservation. Get returns booking detail and price
    summary by reservationId path parameter. Confirm (PATCH) accepts primary
    guest + room preferences and returns an order handle and payment routing.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Reservations
paths:
  /health/live:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/LegacyRequestId'
    get:
      summary: Liveness probe
      operationId: getHealthLive
      tags: [Health]
      responses:
        "200":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/LegacyRequestId'
    get:
      summary: Readiness probe
      operationId: getHealthReady
      tags: [Health]
      responses:
        "200":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Service is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/v1/reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/LegacyRequestId'
      - name: reservationId
        in: path
        required: true
        description: Opaque CCH reservation identifier from create-reservation.
        schema:
          type: string
          minLength: 1
        example: resv_01HXYZexample
    get:
      operationId: getReservation
      summary: Get a reservation
      description: >
        Returns booking detail and price summary for a reservation identified by
        reservationId. Used when the guest opens or refreshes the booking page.

        Validation:
        - reservationId path parameter is required and must be non-blank.
        - Unknown reservationId returns 404 NOT_FOUND (runtime in phase 2+).
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Reservation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReservationResponse"
              examples:
                pendingWithEstimate:
                  summary: Pending reservation with estimated price
                  value:
                    data:
                      status: PENDING
                      property:
                        propertyCode: AN.TH-004
                        propertyId: AN-TH-004
                        name: Anantara Koh Yao Yai Resort & Villas
                        location:
                          address:
                            fullAddress: 101/2 Moo 7, Koh Yao Yai, Koh Yao, Phang Nga, 82160, Thailand
                          coordinates:
                            latitude: 8.012543
                            longitude: 98.591244
                          travelInformation:
                            - 45 minutes by speedboat from Phuket
                          directionUrl: https://maps.google.com/?q=Anantara+Koh+Yao+Yai
                      room:
                        name: Deluxe Pool Villa
                        quantity: 2
                        amount: 33750
                        nights: 2
                        adults: 1
                        children: 1
                        infants: 1
                        board: Breakfast included
                      from: "2026-07-20"
                      to: "2026-07-22"
                      paymentTerms:
                        - Full prepayment required.
                        - Non-refundable.
                      primaryGuest: null
                      guestRooms: null
                      roomPreferences: null
                      priceSummary:
                        currency: THB
                        taxesAndFees:
                          total: 1650
                          items:
                            - name: VAT
                              amount: 1000
                            - name: Fees
                              amount: 650
                        payToday: 35400
                        payAtHotel: 720
                        payAtHotelNote: Pay city tax on arrival
                        total: 36120
                        isEstimate: true
                confirmed:
                  summary: Confirmed reservation (final price)
                  value:
                    data:
                      status: CONFIRMED
                      property:
                        propertyCode: AN.TH-004
                        propertyId: AN-TH-004
                        name: Anantara Koh Yao Yai Resort & Villas
                        location:
                          address:
                            fullAddress: 101/2 Moo 7, Koh Yao Yai, Koh Yao, Phang Nga, 82160, Thailand
                          coordinates:
                            latitude: 8.012543
                            longitude: 98.591244
                          travelInformation:
                            - 45 minutes by speedboat from Phuket
                          directionUrl: https://maps.google.com/?q=Anantara+Koh+Yao+Yai
                      room:
                        name: Deluxe Pool Villa
                        quantity: 1
                        amount: 16875
                        nights: 2
                        adults: 2
                        children: 0
                        infants: 0
                        board: Breakfast included
                      from: "2026-07-20"
                      to: "2026-07-22"
                      paymentTerms:
                        - Full prepayment required.
                        - Non-refundable.
                      primaryGuest:
                        firstName: Ada
                        lastName: Lovelace
                        email: guest@example.com
                        nationality: TH
                        phone:
                          countryCode: "+66"
                          number: "812345678"
                      guestRooms:
                        - guests:
                            - firstName: Ada
                              lastName: Lovelace
                      roomPreferences: []
                      priceSummary:
                        currency: THB
                        taxesAndFees:
                          total: 825
                          items:
                            - name: VAT
                              amount: 500
                            - name: Fees
                              amount: 325
                        payToday: 17700
                        payAtHotel: 0
                        payAtHotelNote: ""
                        total: 17700
                        isEstimate: false
                completed:
                  summary: Completed reservation (guest already stayed)
                  value:
                    data:
                      status: FINISHED
                      property:
                        propertyCode: AN.TH-004
                        propertyId: AN-TH-004
                        name: Anantara Koh Yao Yai Resort & Villas
                        location:
                          address:
                            fullAddress: 101/2 Moo 7, Koh Yao Yai, Koh Yao, Phang Nga, 82160, Thailand
                          coordinates:
                            latitude: 8.012543
                            longitude: 98.591244
                          travelInformation:
                            - 45 minutes by speedboat from Phuket
                          directionUrl: https://maps.google.com/?q=Anantara+Koh+Yao+Yai
                      room:
                        name: Deluxe Pool Villa
                        quantity: 1
                        amount: 16875
                        nights: 2
                        adults: 2
                        children: 0
                        infants: 0
                        board: Breakfast included
                      from: "2026-07-20"
                      to: "2026-07-22"
                      paymentTerms:
                        - Full prepayment required.
                        - Non-refundable.
                      primaryGuest:
                        firstName: Ada
                        lastName: Lovelace
                        email: guest@example.com
                        nationality: TH
                        phone:
                          countryCode: "+66"
                          number: "812345678"
                      guestRooms:
                        - guests:
                            - firstName: Ada
                              lastName: Lovelace
                      roomPreferences: []
                      priceSummary:
                        currency: THB
                        taxesAndFees:
                          total: 825
                          items:
                            - name: VAT
                              amount: 500
                            - name: Fees
                              amount: 325
                        payToday: 17700
                        payAtHotel: 0
                        payAtHotelNote: ""
                        total: 17700
                        isEstimate: false
        "400":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Invalid request (missing or blank reservationId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingReservationId:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: reservationId path parameter is required.
                      traceId: req_example_trace
        "404":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Reservation not found.
                      traceId: req_example_trace
        "500":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/v1/reservations:
    parameters:
      - $ref: '#/components/parameters/LegacyRequestId'
    post:
      operationId: createReservation
      summary: Create a reservation
      description: >
        Starts a reservation from property-detail rate selection, stay dates, and
        per-room occupancy. Returns a reservationId for downstream checkout steps.

        Validation (enforced at runtime; document cross-field rules here because
        OpenAPI schema cannot express them):
        - to must be strictly after from (YYYY-MM-DD).
        - rooms must contain at least one entry.
        - For each room, childAges length must equal childrenCount (empty array when zero).
        - Each child age must be 0–17 inclusive.
        - Idempotency-Key header is required (16–128 characters).
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
            examples:
              singleRoomWithChildren:
                summary: One room, two adults and two children
                value:
                  from: "2026-07-24"
                  to: "2026-07-27"
                  codeForReservation:
                    propertyCode: AN-TH-004
                    roomCode: DELUXE_POOL_VILLA
                    ratePlanCode: ONHR
                    rateGroupCode: ADVANCE_SAVER
                  rooms:
                    - adultsCount: 2
                      childrenCount: 2
                      childAges: [2, 4]
              multiRoomSameType:
                summary: Two rooms of the same type and rate
                value:
                  from: "2026-07-24"
                  to: "2026-07-27"
                  codeForReservation:
                    propertyCode: AN-TH-004
                    roomCode: DELUXE_POOL_VILLA
                    ratePlanCode: ONHR
                    rateGroupCode: ADVANCE_SAVER
                  rooms:
                    - adultsCount: 2
                      childrenCount: 0
                      childAges: []
                    - adultsCount: 1
                      childrenCount: 1
                      childAges: [6]
      responses:
        "201":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReservationResponse"
              examples:
                created:
                  value:
                    data:
                      reservationId: resv_01HXYZexample
        "400":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Invalid request (validation or missing Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidDates:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Check-out date must be after check-in date.
                      traceId: req_example_trace
                childAgesMismatch:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: childAges length must equal childrenCount for each room.
                      traceId: req_example_trace
                missingIdempotencyKey:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Idempotency-Key header is required.
                      traceId: req_example_trace
        "409":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: IDEMPOTENCY_CONFLICT
                      message: The idempotency key cannot be used for this request.
                      traceId: req_example_trace
        "500":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/v1/reservations/{reservationId}/confirm:
    parameters:
      - name: reservationId
        in: path
        required: true
        description: Opaque CCH reservation identifier from create-reservation.
        schema:
          type: string
          minLength: 1
        example: resv_01HXYZexample
    patch:
      operationId: confirmReservation
      summary: Confirm a reservation
      description: >
        Confirms a reservation identified by reservationId, accepting the primary
        guest and room preferences collected on the booking page, and returns an
        order handle plus payment routing for the next checkout step. Modeled as
        PATCH because confirm applies a state change to an existing reservation.

        Validation (enforced at runtime; documented here because OpenAPI schema
        cannot express all cross-field rules):
        - reservationId path parameter is required and must be non-blank.
        - Idempotency-Key header is required (16–128 characters); reuse on retry.
        - Unknown reservationId returns 404 NOT_FOUND (runtime in phase 2+).
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReservationRequest"
            examples:
              withPreference:
                summary: Primary guest with one room preference
                value:
                  primaryGuest:
                    firstName: Ada
                    lastName: Lovelace
                    email: guest@example.com
                    nationality: TH
                    phone:
                      countryCode: "+66"
                      number: "812345678"
                  guestRooms:
                    - guests:
                        - firstName: Ada
                          lastName: Lovelace
                        - firstName: Charles
                          lastName: Babbage
                  roomPreferences:
                    - type: BED_TYPE
                      value: KING
              noPreferences:
                summary: Primary guest, no preferences
                value:
                  primaryGuest:
                    firstName: Ada
                    lastName: Lovelace
                    email: guest@example.com
                    nationality: TH
                    phone:
                      countryCode: "+66"
                      number: "812345678"
                  guestRooms:
                    - guests:
                        - firstName: Ada
                          lastName: Lovelace
                  roomPreferences: []
      responses:
        "200":
          description: Reservation confirmed; order handle and payment routing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmReservationResponse"
              examples:
                juspay:
                  summary: Routed to Juspay
                  value:
                    data:
                      orderId: 6b1f2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
                      payment:
                        needMethodSelection: false
                        service: JUSPAY
                pciBubblePreselected:
                  summary: Routed to PCI bubble; method already determined
                  value:
                    data:
                      orderId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      payment:
                        needMethodSelection: false
                        service: PCI_BUBBLE
        "400":
          description: Invalid request (missing reservationId, missing Idempotency-Key, or invalid body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingReservationId:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: reservationId path parameter is required.
                      traceId: req_example_trace
                invalidBody:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: primaryGuest is required.
                      traceId: req_example_trace
                missingIdempotencyKey:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Idempotency-Key header is required.
                      traceId: req_example_trace
        "404":
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Reservation not found.
                      traceId: req_example_trace
        "409":
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: IDEMPOTENCY_CONFLICT
                      message: The idempotency key cannot be used for this request.
                      traceId: req_example_trace
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/v1/reservations/{reservationId}/cancel:
    parameters:
      - name: reservationId
        in: path
        required: true
        description: Opaque CCH reservation identifier from create-reservation.
        schema:
          type: string
          minLength: 1
        example: resv_01HXYZexample
    post:
      operationId: cancelReservation
      summary: Cancel a reservation
      description: >
        Cancels a reservation identified by reservationId. Modeled as POST
        because cancel is a side-effecting action on an existing reservation.

        Validation (enforced at runtime; documented here because OpenAPI schema
        cannot express all cross-field rules):
        - reservationId path parameter is required and must be non-blank.
        - Unknown reservationId returns 404 NOT_FOUND.
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Reservation successfully cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelReservationResponse"
              examples:
                cancelled:
                  summary: Reservation cancelled successfully
                  value:
                    data: {}
        "400":
          description: Invalid request (missing reservationId or invalid input)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingReservationId:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: reservationId path parameter is required.
                      traceId: req_example_trace
        "404":
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error:
                      code: NOT_FOUND
                      message: Reservation not found.
                      traceId: req_example_trace
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/v1/reference/nationalities:
    get:
      operationId: getReferenceNationalities
      summary: Get supported nationalities
      description: >
        Returns a list of supported nationalities sorted alphabetically by nationality name.
        Uses standard ISO 3166-1 alpha-2 country codes.
      tags: [Reference]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/LegacyRequestId"
      responses:
        "200":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Supported nationalities list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNationalitiesResponse"
              examples:
                success:
                  value:
                    data:
                      - code: TH
                        name: Thai
                      - code: SG
                        name: Singaporean
                      - code: US
                        name: American
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/v1/reference/country-codes:
    get:
      operationId: getReferenceCountryCodes
      summary: Get country calling codes
      description: >
        Returns a list of country telephone calling/dialing prefixes (e.g., +66)
        along with their standard country name and ISO 3166-1 alpha-2 codes.
      tags: [Reference]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/LegacyRequestId"
      responses:
        "200":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Country calling codes list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCountryCodesResponse"
              examples:
                success:
                  value:
                    data:
                      - code: TH
                        name: Thailand
                        countryCode: "+66"
                      - code: SG
                        name: Singapore
                        countryCode: "+65"
                      - code: US
                        name: United States
                        countryCode: "+1"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/v1/reference/room-preferences:
    get:
      operationId: getReferenceRoomPreferences
      summary: Get room preference selection metadata
      description: >
        Returns the room preference selection questions and options to let guests select preferences.
      tags: [Reference]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/LegacyRequestId"
      responses:
        "200":
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            X-Request-ID: { $ref: '#/components/headers/LegacyRequestId' }
          description: Room preference selection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRoomPreferenceSelectionResponse"
              examples:
                success:
                  value:
                    data:
                      questions:
                        - type: BED_TYPE
                          text: What is your preferred bed type?
                        - type: SMOKING_PREFERENCE
                          text: Do you prefer a smoking or non-smoking room?
                      options:
                        - type: BED_TYPE
                          label: King Bed
                          value: KING
                        - type: BED_TYPE
                          label: Twin Bed
                          value: TWIN
                        - type: SMOKING_PREFERENCE
                          label: Non-Smoking
                          value: NON_SMOKING
                        - type: SMOKING_PREFERENCE
                          label: Smoking
                          value: SMOKING
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  headers:
    CorrelationId:
      description: >-
        Canonical operational correlation identifier selected or generated
        for this request. It is distinct from the W3C trace identifier.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    LegacyRequestId:
      description: Deprecated response alias with the same value as X-Correlation-ID.
      required: true
      deprecated: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for this submit (16–128 characters). Reuse the same value when retrying the same request after a network error.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Canonical operational correlation identifier. Exactly one valid
        value is accepted. A present invalid canonical value never falls
        back to the legacy header.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    LegacyRequestId:
      name: X-Request-ID
      in: header
      required: false
      deprecated: true
      description: >-
        Migration-only alias accepted when the canonical header is absent.
        If both headers are present, they must be one equal valid value.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Health"
    Health:
      type: object
      required:
        - service
        - state
      properties:
        service:
          type: string
          example: reservation-service
        state:
          type: string
          example: ok
        checkedAt:
          type: string
          format: date-time
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required: [from, to, codeForReservation, rooms]
      properties:
        from:
          type: string
          format: date
          description: Check-in date (inclusive).
        to:
          type: string
          format: date
          description: Check-out date (exclusive). Must be after from.
        codeForReservation:
          $ref: "#/components/schemas/CodeForReservation"
        rooms:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReservationRoom"
    CodeForReservation:
      type: object
      description: >
        Canonical identifiers from property detail RateCodeForReservation.
        propertyCode, roomCode, ratePlanCode, and rateGroupCode are required.
      additionalProperties: false
      required: [propertyCode, roomCode, ratePlanCode, rateGroupCode]
      properties:
        propertyCode:
          type: string
          minLength: 1
        roomCode:
          type: string
          minLength: 1
        ratePlanCode:
          type: string
          minLength: 1
        rateGroupCode:
          type: string
          minLength: 1
    ReservationRoom:
      type: object
      additionalProperties: false
      required: [adultsCount, childrenCount, childAges]
      properties:
        adultsCount:
          type: integer
          minimum: 1
        childrenCount:
          type: integer
          minimum: 0
        childAges:
          type: array
          description: >
            Ages in years for each child. Array length MUST equal childrenCount
            (use an empty array when childrenCount is 0).
          items:
            type: integer
            minimum: 0
            maximum: 17
    CreateReservationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CreateReservationData"
    CreateReservationData:
      type: object
      required: [reservationId]
      properties:
        reservationId:
          type: string
          minLength: 1
          description: Opaque CCH reservation identifier.
    GetReservationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/GetReservationData"
    ReservationProperty:
      type: object
      additionalProperties: false
      required: [propertyCode, propertyId, name, location]
      properties:
        propertyCode:
          type: string
          description: Internal unique code for the hotel/property.
          example: AN.TH-004
        propertyId:
          type: string
          description: Unique string identifier for the property (previously hyphenated propertyCode format).
          example: AN-TH-004
        name:
          type: string
          description: Display name of the hotel/property.
          example: Anantara Koh Yao Yai Resort & Villas
        location:
          $ref: "#/components/schemas/PropertyLocation"
    PropertyLocation:
      type: object
      required: [address, coordinates, travelInformation]
      properties:
        address:
          $ref: "#/components/schemas/PropertyAddress"
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        travelInformation:
          type: array
          items:
            type: string
        directionUrl:
          type: string
          format: uri
    PropertyAddress:
      type: object
      additionalProperties: false
      required: [fullAddress]
      properties:
        fullAddress:
          type: string
          description: Complete formatted postal address of the property.
          example: 101/2 Moo 7, Koh Yao Yai, Koh Yao, Phang Nga, 82160, Thailand
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    GetReservationData:
      type: object
      additionalProperties: false
      required:
        - status
        - property
        - room
        - from
        - to
        - paymentTerms
        - primaryGuest
        - guestRooms
        - roomPreferences
        - priceSummary
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, FINISHED]
        property:
          $ref: "#/components/schemas/ReservationProperty"
        room:
          $ref: "#/components/schemas/PriceSummaryRoom"
        from:
          type: string
          format: date
          description: Check-in date (inclusive).
          example: 2026-07-20
        to:
          type: string
          format: date
          description: Check-out date (exclusive). Must be after from.
          example: 2026-07-22
        paymentTerms:
          type: array
          description: Applicable terms and conditions for payment (e.g. rate-specific guarantee or cancellation policy).
          items:
            type: string
          example: ["Full prepayment required.", "Non-refundable."]
        primaryGuest:
          anyOf:
            - $ref: "#/components/schemas/PrimaryGuest"
          nullable: true
        guestRooms:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/GuestRoom"
        roomPreferences:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RoomPreference"
        priceSummary:
          $ref: "#/components/schemas/PriceSummary"
    PrimaryGuest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, nationality, phone]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        nationality:
          type: string
        phone:
          $ref: "#/components/schemas/Phone"
    Phone:
      type: object
      additionalProperties: false
      required: [countryCode, number]
      properties:
        countryCode:
          type: string
          description: International dialing prefix (e.g. +66).
        number:
          type: string
          description: National number without country code.
    GuestRoom:
      type: object
      additionalProperties: false
      required: [guests]
      properties:
        guests:
          type: array
          items:
            $ref: "#/components/schemas/RoomGuest"
    RoomGuest:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
    RoomPreference:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          description: >
            Preference category. Closed enum values are deferred; treat as opaque
            string until product locks the list.
        value:
          type: string
    PriceSummary:
      type: object
      additionalProperties: false
      required:
        - currency
        - taxesAndFees
        - payToday
        - payAtHotel
        - payAtHotelNote
        - total
        - isEstimate
      properties:
        currency:
          type: string
          example: THB
        taxesAndFees:
          $ref: "#/components/schemas/TaxesAndFees"
        payToday:
          type: number
        payAtHotel:
          type: number
        payAtHotelNote:
          type: string
        total:
          type: number
        isEstimate:
          type: boolean
    PriceSummaryRoom:
      type: object
      additionalProperties: false
      required:
        - name
        - quantity
        - amount
        - nights
        - adults
        - children
        - infants
        - board
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        amount:
          type: number
        nights:
          type: integer
          minimum: 1
        adults:
          type: integer
          minimum: 0
        children:
          type: integer
          minimum: 0
        infants:
          type: integer
          minimum: 0
        board:
          type: string
    TaxesAndFees:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaxFeeItem"
    TaxFeeItem:
      type: object
      additionalProperties: false
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: number
    ConfirmReservationRequest:
      type: object
      additionalProperties: false
      required: [primaryGuest, guestRooms, roomPreferences]
      properties:
        primaryGuest:
          $ref: "#/components/schemas/PrimaryGuest"
        guestRooms:
          type: array
          items:
            $ref: "#/components/schemas/GuestRoom"
        roomPreferences:
          type: array
          description: May be empty when no preferences are set.
          items:
            $ref: "#/components/schemas/RoomPreference"
    ConfirmReservationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ConfirmReservationData"
    ConfirmReservationData:
      type: object
      additionalProperties: false
      required: [orderId, payment]
      properties:
        orderId:
          type: string
          format: uuid
          description: Order handle created by confirmation.
          example: 6b1f2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        payment:
          $ref: "#/components/schemas/Payment"
    Payment:
      type: object
      additionalProperties: false
      required: [needMethodSelection, service]
      properties:
        needMethodSelection:
          type: boolean
          description: True when the guest must still choose a payment method.
        service:
          type: string
          description: Payment service the client must use next.
          enum: [JUSPAY, PCI_BUBBLE]
    CancelReservationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CancelReservationData"
    CancelReservationData:
      type: object
      additionalProperties: false
    GetNationalitiesResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Nationality"
    Nationality:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code:
          type: string
          example: TH
          description: ISO 3166-1 alpha-2 country code.
        name:
          type: string
          example: Thai
          description: English nationality name.
    GetCountryCodesResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CountryCode"
    CountryCode:
      type: object
      required: [code, name, countryCode]
      additionalProperties: false
      properties:
        code:
          type: string
          example: TH
          description: ISO 3166-1 alpha-2 country code.
        name:
          type: string
          example: Thailand
          description: English country name.
        countryCode:
          type: string
          example: "+66"
          description: International dialing prefix.
    GetRoomPreferenceSelectionResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/RoomPreferenceSelection"
    RoomPreferenceSelection:
      type: object
      required: [questions, options]
      additionalProperties: false
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/RoomPreferenceQuestion"
        options:
          type: array
          items:
            $ref: "#/components/schemas/RoomPreferenceOption"
    RoomPreferenceQuestion:
      type: object
      required: [type, text, multiple]
      additionalProperties: false
      properties:
        type:
          type: string
          example: BED_TYPE
          description: Opaque category string.
        text:
          type: string
          example: What is your preferred bed type?
          description: Question text to display.
        multiple:
          type: boolean
          example: false
          description: Whether multiple options can be selected for this question.
    RoomPreferenceOption:
      type: object
      required: [type, label, value]
      additionalProperties: false
      properties:
        type:
          type: string
          example: BED_TYPE
          description: Matches a question type category.
        label:
          type: string
          example: King Bed
          description: User-facing option display label.
        value:
          type: string
          example: KING
          description: Opaque option value to submit in reservation body.
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - INTERNAL_ERROR
            - MISCONFIGURED
            - SERVICE_UNAVAILABLE
        message:
          type: string
        traceId:
          description: Legacy field containing the operational correlation ID; not a W3C trace ID.
          type: string
